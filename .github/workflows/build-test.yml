name: .NET build, test, pack & Nuget push
on:
  push:
    branches: [ "master" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Git - check out repository code
        uses: actions/checkout@v4

      - name: .NET - setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: .NET - restore & Build
        run: dotnet build

      - name: Docker - run Postgres
        uses: hoverkraft-tech/compose-action@v2.0.1

      - name: .NET - test
        run: dotnet test

      - name: NuGet login
        if: github.actor == github.repository_owner && startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: login
        with:
          user: mrshrinkray

      - name: Nuget - push tag package
        if: startsWith(github.ref, 'refs/tags/v') && github.actor == github.repository_owner
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          dotnet pack src/Marten.AspNetIdentity/Marten.AspNetIdentity.csproj -c Release /p:PackageVersion=$VERSION
          dotnet nuget push "src/Marten.AspNetIdentity/bin/Release/Marten.AspNetIdentity.$VERSION.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
